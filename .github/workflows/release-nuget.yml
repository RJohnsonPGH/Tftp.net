name: Publish NuGet package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-nuget:
    name: Pack and publish library
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test

      - name: Pack library
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Tftp.Net \
            -c Release \
            -p:Version="$VERSION" \
            -o artifacts/nupkg

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/nupkg/RJohnsonPGH.Tftp.Net.*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate